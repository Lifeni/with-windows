name: 构建与测试（PR）

# 只负责"合并前校验"，避免与 release.yml 在 push 到 main 时重复跑一遍
# main 上的回归由 release.yml 负责（它总是先跑测试，再决定是否发布）
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建（WinUI 3 需要 x64 平台）
        run: dotnet build WithWindows.sln -c Release -p:Platform=x64

      - name: 测试
        run: dotnet test tests/WithWindows.UI.Tests/WithWindows.UI.Tests.csproj -c Release -p:Platform=x64 --no-build

      # 单文件发布容易在 SDK/WindowsAppSDK 升级后静默失效，这里每次都验一遍
      - name: 校验单文件发布
        run: dotnet publish src/WithWindows.UI/WithWindows.UI.csproj -c Release -o dist-check -p:Platform=x64 -p:SelfContained=true -p:PublishSingleFile=true

      - name: 校验单文件产物
        shell: pwsh
        run: |
          if (-not (Test-Path dist-check/WithWindows.exe)) { Write-Error "未生成单文件 exe" }
          $size = (Get-Item dist-check/WithWindows.exe).Length / 1MB
          Write-Host "单文件 exe 大小: $([math]::Round($size, 1)) MB"
