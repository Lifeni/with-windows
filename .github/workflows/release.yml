name: 构建并发布 Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 测试
        run: dotnet test tests/WithWindows.UI.Tests/WithWindows.UI.Tests.csproj -c Release -p:Platform=x64

      - name: 发布产物
        run: dotnet publish src/WithWindows.UI/WithWindows.UI.csproj -c Release -o dist -p:Platform=x64 -p:SelfContained=true

      - name: 打包为 zip（自包含目录需整体分发才能运行）
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath with-windows.zip

      - name: 提取更新日志为 Release 正文
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $content = Get-Content CHANGELOG.md -Raw
          $pat = "(?s)##\s*\[" + [regex]::Escape($tag) + "\].*?(?=\r?\n##\s|\z)"
          $m = [regex]::Match($content, $pat)
          if (-not $m.Success) { Write-Error "CHANGELOG.md 缺少 [$tag] 章节" }
          Set-Content -Path release_body.md -Value $m.Value -Encoding utf8

      - name: 上传 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: with-windows.zip
          body_path: release_body.md
