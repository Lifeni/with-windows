name: 构建并发布 Release

# 只在"版本更新"时构建发布：
#   - push 到 main：csproj 的 <Version> 若还没有对应的 vX.Y.Z tag，则自动打 tag 并发布；已有 tag 直接跳过
#   - push v* tag：直接发布，并校验 tag 与 csproj 版本一致
# 产物：Inno Setup 安装器 + 便携 zip（内含 exe 与 Assets）+ SHA256SUMS.txt
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新发布当前版本（即使 tag 已存在）'
        type: boolean
        default: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 需要读取已有 tag

      - name: 判断是否需要发布
        id: version
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content src/WithWindows.App/WithWindows.App.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          $tag = "v$version"

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            Write-Error "tag $env:GITHUB_REF_NAME 与 csproj 版本 $tag 不一致"
          }

          $tagExists = [bool](git tag -l $tag)
          $force = "${{ inputs.force }}" -eq 'true'
          $needRelease = $force -or ($env:GITHUB_REF_TYPE -eq 'tag') -or (-not $tagExists)

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "need_release=$($needRelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "csproj 版本 $version，目标 tag $tag，tag 已存在 $tagExists，强制 $force，本次发布 $needRelease"

      - name: 版本未更新则跳过
        if: steps.version.outputs.need_release == 'false'
        run: Write-Host "版本 ${{ steps.version.outputs.tag }} 已发布过：本次只跑测试，不构建发布产物（改 <Version> 后 push 即自动发布）"

      - name: 测试
        run: dotnet test tests/WithWindows.Core.Tests/WithWindows.Core.Tests.csproj -c Release -p:Platform=x64

      - name: 生成便携载荷（自包含单文件）
        if: steps.version.outputs.need_release == 'true'
        run: dotnet publish src/WithWindows.App/WithWindows.App.csproj -c Release -o dist -p:Platform=x64 -p:SelfContained=true -p:PublishSingleFile=true

      - name: 安装 Inno Setup
        if: steps.version.outputs.need_release == 'true'
        run: choco install innosetup --no-progress -y

      - name: 编译安装器
        if: steps.version.outputs.need_release == 'true'
        shell: pwsh
        run: |
          $ver = [regex]::Match((Get-Content src/WithWindows.App/WithWindows.App.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer\WithWindows.iss
          if (-not (Test-Path "dist-installer/WithWindows-$ver-x64-setup.exe")) { Write-Error "未生成安装器" }

      - name: 整理产物与校验和
        if: steps.version.outputs.need_release == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          # 安装器文件名用的是不带 v 的版本号（ISCC /DAppVersion=$ver），tag 才带 v 前缀
          $ver = $tag.TrimStart('v')
          Copy-Item "dist-installer/WithWindows-$ver-x64-setup.exe" "WithWindows-$tag-x64-setup.exe"
          # 只打包 exe 与 Assets：不要 dist/*，否则会把 PDB 调试符号一起发到 Release
          Compress-Archive -Path dist/WithWindows.exe, dist/Assets -DestinationPath "WithWindows-$tag-x64-portable.zip" -Force
          Get-ChildItem "WithWindows-$tag-x64-*.exe", "WithWindows-$tag-x64-*.zip" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding utf8

      - name: 提取更新日志为 Release 正文
        if: steps.version.outputs.need_release == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $content = Get-Content CHANGELOG.md -Raw
          $pat = "(?s)##\s*\[" + [regex]::Escape($tag) + "\].*?(?=\r?\n##\s|\z)"
          $m = [regex]::Match($content, $pat)
          if (-not $m.Success) { Write-Error "CHANGELOG.md 缺少 [$tag] 章节" }
          Set-Content -Path release_body.md -Value $m.Value -Encoding utf8

      - name: 打 tag 并上传 GitHub Release
        if: steps.version.outputs.need_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            WithWindows-*-x64-setup.exe
            WithWindows-*-x64-portable.zip
            SHA256SUMS.txt
          body_path: release_body.md
